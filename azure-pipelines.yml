trigger:
- main

pool:
  name: Default
  demands:
   - agent.name -equals VM-DEVOPS

variables:
  BUILD_CONFIGURATION: 'Release'
  IMAGE_NAME: 'ui_testgsm_image'
  SERVER_USER: 'adminprod'
  SERVER_IP: '192.168.1.104'
  SERVER_PATH: 'C:\Deploy\containers\ui_testgsm_container'
  CONTAINER_NAME: 'ui_testgsm_container'
  APP_PORT: '8015'

# Required secret variable:
# - SSH_PASSWORD must be configured as a secret variable in Azure DevOps.

stages:
- stage: Build
  displayName: "Build Docker Image"
  jobs:
  - job: Build
    displayName: "Build Docker"
    steps:
    - script: |
        echo "Building Docker image..."
        docker build -t $(IMAGE_NAME):latest -f Dockerfile .
      displayName: "Build Docker"

    - script: |
        echo "Saving Docker image..."
        docker save $(IMAGE_NAME):latest -o $(IMAGE_NAME).tar
      displayName: "Save Docker image"

    - task: PublishBuildArtifacts@1
      displayName: "Publish Docker image artifact"
      inputs:
        pathToPublish: "$(IMAGE_NAME).tar"
        artifactName: "docker-image"

- stage: Deploy
  displayName: "Deploy to 192.168.1.104"
  dependsOn: Build
  jobs:
  - job: Deploy
    displayName: "Deploy over SSH"
    steps:
    - task: DownloadBuildArtifacts@0
      displayName: "Download Docker image artifact"
      inputs:
        buildType: 'current'
        artifactName: 'docker-image'
        downloadPath: '$(Pipeline.Workspace)'

    - script: |
        echo "Creating remote deployment directory..."
        plink -batch -pw $(SSH_PASSWORD) $(SERVER_USER)@$(SERVER_IP) "mkdir -p $(SERVER_PATH)"
        pscp -batch -pw $(SSH_PASSWORD) $(Pipeline.Workspace)/docker-image/$(IMAGE_NAME).tar $(SERVER_USER)@$(SERVER_IP):$(SERVER_PATH)/
        pscp -batch -pw $(SSH_PASSWORD) .env.production $(SERVER_USER)@$(SERVER_IP):$(SERVER_PATH)/.env.production
      displayName: "Transfer Docker image"

    - script: |
        echo "Stopping current container..."
        plink -batch -pw $(SSH_PASSWORD) $(SERVER_USER)@$(SERVER_IP) "docker stop $(CONTAINER_NAME) || exit 0"
      displayName: "Stop current container"

    - script: |
        echo "Removing current container..."
        plink -batch -pw $(SSH_PASSWORD) $(SERVER_USER)@$(SERVER_IP) "docker rm $(CONTAINER_NAME) || exit 0"
      displayName: "Remove current container"

    - script: |
        echo "Removing previous Docker image..."
        plink -batch -pw $(SSH_PASSWORD) $(SERVER_USER)@$(SERVER_IP) "docker rmi $(IMAGE_NAME):latest || exit 0"
      displayName: "Remove previous Docker image"

    - script: |
        echo "Loading new Docker image..."
        plink -batch -pw $(SSH_PASSWORD) $(SERVER_USER)@$(SERVER_IP) "docker load -i $(SERVER_PATH)/$(IMAGE_NAME).tar"
      displayName: "Load new Docker image"

    - script: |
        echo "Starting new container..."
        plink -batch -pw $(SSH_PASSWORD) $(SERVER_USER)@$(SERVER_IP) "docker run -d --name $(CONTAINER_NAME) --restart unless-stopped -p $(APP_PORT):80 --env-file $(SERVER_PATH)/.env.production $(IMAGE_NAME):latest"
      displayName: "Start new container"
